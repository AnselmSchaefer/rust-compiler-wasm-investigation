[package]
name = "resolver"
version = "0.1.0"
edition = "2024"
description = "Cargo-compatible dependency resolver, Cargo.lock writer and build planner for the browser IDE (WP-15, WP-17)."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
cargo-platform = "0.3.3"
cargo-util-schemas = "0.14.3"
im-rc = "15.1.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25"
