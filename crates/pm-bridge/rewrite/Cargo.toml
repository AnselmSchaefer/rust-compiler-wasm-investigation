[package]
name = "pm-rewrite"
version = "0.1.0"
edition = "2021"
description = "Turn a proc-macro crate into a wasm32-wasip1 cdylib guest of the rust:proc-macro world"

[dependencies]
syn = { version = "2", features = ["full", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
