# WP-19 demo with serde_derive compiled to Wasm (pm-shim-serde). Same source as ../native.
[package]
name = "demo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "demo"
path = "../src/main.rs"

[dependencies]
serde = "=1.0.229"
serde_json = "1"
serde_derive = { package = "pm-shim-serde", path = "../../../../crates/pm-bridge/shim-serde" }

[workspace]
