# WP-20 planner case: proc macros. serde with `derive` (serde_derive, built for the host, with
# syn/quote/proc-macro2; proc-macro2 has a build script) and thiserror.
[package]
name = "derive"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
